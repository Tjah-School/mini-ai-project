/* Layout: garage scene + co-builder on the left, the question card on the right; stacks to one column on phones. */
:root{
  --bg:#e6e9eb; --panel:#fbfbfa; --panel2:#f1f3f4; --ink:#1c2227; --muted:#56616a; --line:#d0d6da;
  --accent:#e8621a; --accent-ink:#ffffff; --accent-soft:#fbe3d4;
  --good:#1b8a4b; --good-soft:#dbf1e3; --bad:#c9372a; --bad-soft:#fae0dc; --warn:#b98600; --warn-soft:#fbf0cf;
  --wall:#cfd5d8; --board:#c4a57d; --peg:#86694a; --floor:#9aa2a7; --floor2:#8b9398; --wood:#a66d3c; --wood2:#82532b;
  --metal:#5c6770; --metal2:#39424a; --screen:#0f1f2d; --bp:#1c4c82; --bp-line:#3769a2; --bp-ink:#d7ebff;
  --rb:#eef2f4; --rb-edge:#2f3b45; --rb-dark:#9ba8b2; --eye-off:#4a5761; --eye-on:#2fd2ff;
  --code1:#7fd1ff; --code2:#ffd36b; --code3:#9be37f; --pcb:#1f8a4c; --chip:#17251d; --chip-on:#ffd34d;
  --w1:#e5483a; --w2:#f2c230; --w3:#3b82f6; --w4:#22a35a;
  --flame1:#ff7a1a; --flame2:#ffd23f; --smoke:#737b80; --boom1:#ffb02e; --boom2:#ff5a1f; --burnt:#3b3431;
  --skin:#c98e62; --skin2:#e2b08a; --face-ink:#2a1c16; --cap:#11a19d; --cap2:#0b7774; --hood:#33409a; --headset:#22282d; --tear:#43a8ff;
  --font-d:"Bungee","Arial Black",Impact,sans-serif;
  --font-b:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1316; --panel:#171d22; --panel2:#1d242a; --ink:#e6ebee; --muted:#9aa6af; --line:#2a333a;
    --accent:#ff7a30; --accent-ink:#1a0d05; --accent-soft:#3a2315;
    --good:#43c47d; --good-soft:#14301f; --bad:#ff6b5b; --bad-soft:#3a1916; --warn:#f0c040; --warn-soft:#3a3014;
    --wall:#232b31; --board:#4a3b2a; --peg:#2a2118; --floor:#2e353a; --floor2:#272e33; --wood:#6c482a; --wood2:#52361e;
    --metal:#4b555d; --metal2:#262e34; --screen:#07111a; --bp:#11335a; --bp-line:#1f4b7a; --bp-ink:#cfe6ff;
    --rb:#d5dce1; --rb-edge:#0e1317; --rb-dark:#7c8994; --eye-off:#2b353c;
    --smoke:#545c61; --burnt:#2a2421;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1316; --panel:#171d22; --panel2:#1d242a; --ink:#e6ebee; --muted:#9aa6af; --line:#2a333a;
  --accent:#ff7a30; --accent-ink:#1a0d05; --accent-soft:#3a2315;
  --good:#43c47d; --good-soft:#14301f; --bad:#ff6b5b; --bad-soft:#3a1916; --warn:#f0c040; --warn-soft:#3a3014;
  --wall:#232b31; --board:#4a3b2a; --peg:#2a2118; --floor:#2e353a; --floor2:#272e33; --wood:#6c482a; --wood2:#52361e;
  --metal:#4b555d; --metal2:#262e34; --screen:#07111a; --bp:#11335a; --bp-line:#1f4b7a; --bp-ink:#cfe6ff;
  --rb:#d5dce1; --rb-edge:#0e1317; --rb-dark:#7c8994; --eye-off:#2b353c;
  --smoke:#545c61; --burnt:#2a2421;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{font-family:var(--font-d);font-size:1.25rem;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:10px}
.brand .hz{width:30px;height:14px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--warn) 0 6px,var(--ink) 6px 12px)}
.tracker{display:flex;gap:8px;flex-wrap:wrap}
.stg{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted)}
.stg.on{color:var(--ink);border-color:var(--accent)}
.stg .n{font-family:var(--font-d);font-size:.72rem;color:var(--accent)}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.act{background:var(--accent)}
.dot.ok{background:var(--good)}
.dot.flaw{background:var(--warn)}
.dot.bad{background:var(--bad)}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .left{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
}
.left{display:grid;gap:10px;min-width:0}

/* scene */
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.stamp{position:absolute;top:12%;right:6%;font-family:var(--font-d);font-size:clamp(1rem,4.6vw,1.6rem);color:var(--bad);border:3px solid var(--bad);
  padding:2px 10px;border-radius:6px;transform:rotate(-9deg);background:color-mix(in srgb,var(--panel) 75%,transparent);letter-spacing:.04em;pointer-events:none}
.station{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}

.caption{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.caprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.captitle{font-weight:700}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.chip.work{background:var(--accent-soft);color:var(--accent)}
.chip.paused{background:var(--bad-soft);color:var(--bad)}
.chip.done{background:var(--good-soft);color:var(--good)}
.bar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,var(--ink)) 8px 16px)}
.capsub{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* co-builder */
.buddy{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:0 0 76px;width:76px;height:76px;border-radius:50%;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
.bubble{position:relative;flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who b{font-family:var(--font-d);font-size:.85rem;letter-spacing:.03em}
.emo{font-size:.75rem;font-style:italic;color:var(--accent);font-weight:600}
.line{margin:2px 0 0;font-weight:600;font-size:1.02rem;text-wrap:pretty}
.emo-excited .avatar svg{animation:hop .5s ease-out 2}
.emo-scared .avatar svg{animation:shake .12s linear 8}
.emo-sad .avatar svg{transform:translateY(3px)}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;min-width:0}
.meter{display:grid;gap:5px}
.meterbar{position:relative;height:12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:visible}
.meterbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--good);width:0;transition:width .5s}
.meterbar .half{position:absolute;top:-4px;bottom:-4px;left:50%;width:2px;background:var(--ink);opacity:.55}
.meterrow{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qtext{margin:0;font-size:1.18rem;line-height:1.35;font-weight:600;text-wrap:pretty}
pre.ctx{margin:0;font-family:var(--font-m);font-size:.8rem;line-height:1.5;background:var(--screen);color:#d8e6f2;padding:12px;border-radius:10px;overflow-x:auto;white-space:pre}
.ctx.plain{white-space:pre-wrap;font-family:var(--font-b);font-size:.92rem;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel2);transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-d);font-size:.78rem;background:var(--panel);border:1px solid var(--line)}
.opt .t{flex:1;min-width:0;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:12px;padding:12px;display:grid;gap:4px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb h3{margin:0;font-size:1rem}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{margin:0;font-size:.92rem}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* start + end */
.h1{font-family:var(--font-d);font-size:clamp(1.4rem,5vw,2rem);line-height:1.05;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps .num{font-family:var(--font-d);font-size:.95rem;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.9rem}
.rules{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:.9rem}
.rules p{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg small{display:block;color:var(--muted);font-weight:500}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--font-d);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.report{width:100%;border-collapse:collapse;font-size:.9rem}
.report td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.report td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.report td:last-child{text-align:right}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.flaw{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.na{background:var(--panel2);color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
summary{font-weight:700;cursor:pointer}
.miss{display:grid;gap:3px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.miss:first-of-type{border-top:0}
.miss .a{color:var(--good);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){
  .emo-excited .avatar svg,.emo-scared .avatar svg{animation:none}
  .meterbar i{transition:none}
}
</style>

ard syntax, and cannot be run directly by a computer?","x":"","o":["Natural language","Flowchart","Pseudocode","A Python program"],"c":[2],"m":false,"n":""},{"s":"ads","t":"2.1 Algorithms: Definition, Properties and Representation","q":"Which flowchart symbol is used to read data or show a result?","x":"","o":["Oval (terminator)","Rectangle (process)","Parallelogram (input/output)","Diamond (decision)"],"c":[2],"m":false,"n":"input/output"},{"s":"ads","t":"2.1 Algorithms: Definition, Properties and Representation","q":"Which of the following are properties that a procedure must have to count as an algorithm?","x":"","o":["Finiteness","Definiteness","It finishes in under one second","Effectiveness","It is written in Python"],"c":[0,1,3],"m":true,"n":""},{"s":"ads","t":"2.2 Efficiency (Big-O) and Searching","q":"The FindMax algorithm makes one comparison per item after the first and stores only a few variables. Which statement gives its time and extra space correctly?","x":"","o":["O(n) time, O(1) extra space","O(n²) time, O(n) extra space","O(log n) time, O(1) extra space","O(n) time, O(n) extra space"],"c":[0],"m":false,"n":""},{"s":"ads","t":"2.2 Efficiency (Big-O) and Searching","q":"Binary search (with mid = (low + high) // 2) looks for 23 in [2, 5, 8, 12, 16, 23, 38, 56, 72, 91] (indexes 0 to 9). How many times does it compare items[mid] with the target before finding it?","x":"","o":["1","2","3","8"],"c":[2],"m":false,"n":"mid = 4 gives 16 < 23, so low = 5; mid = 7 gives 56 > 23, so high = 6; mid = 5 gives 23, found"},{"s":"ads","t":"2.2 Efficiency (Big-O) and Searching","q":"You must search an unsorted list of 1,000 items exactly once. Which approach is cheapest?","x":"","o":["Sort with merge sort, then use binary search","Use linear search directly","Sort with bubble sort, then use binary search","Use binary search directly on the unsorted list"],"c":[1],"m":false,"n":""},{"s":"ads","t":"2.2 Efficiency (Big-O) and Searching","q":"At 10⁹ operations per second 6      14\n        / \\     /\n       4   7   13","o":["8, 3, 1, 6, 4, 7, 10, 14, 13","1, 3, 4, 6, 7, 8, 10, 13, 14","1, 4, 7, 6, 3, 13, 14, 10, 8","8, 3, 10, 1, 6, 14, 4, 7, 13"],"c":[0],"m":false,"n":""},{"s":"ads","t":"2.7 Trees, Binary Trees and Binary Search Trees","q":"Keys 1, 2, 3, 4, 5 are inserted, in this order, into an empty plain BST. What is the result?","x":"","o":["A perfect tree of height 2","A degenerate (skewed) tree of height 4, in which search costs O(n)","A balanced tree of height 3","A tree of height 1"],"c":[1],"m":false,"n":""},{"s":"ads","t":"2.7 Trees, Binary Trees and Binary Search Trees","q":"In the tree shown above, node 3 (with children 1 and 6) is deleted. Which key takes its place, according to the \"two children\" rule?","x":"Binary search tree built by inserting 8, 3, 10, 1, 6, 14, 4, 7, 13:\n\n          8\n        /   \\\n       3     10\n      / \\      \\\n     1   6      14\n        / \\     /\n       4   7   13","o":["1","4","6","7"],"c":[1],"m":false,"n":"the in-order successor: the smallest key in 3's right subtree"},{"s":"ads","t":"2.7 Trees, Binary Trees and Binary Search Trees","q":"A perfect binary tree has height 3 (counting edges, root at height 0). Which statements are correct?","x":"","o":["It has 15 nodes","It has 8 leaves","It has 16 nodes","Every node has 0 or 2 children","Its height is n − 1, where n is the number of nodes"],"c":[0,1,3],"m":true,"n":"2⁴ − 1 = 15 nodes, 2³ = 8 leaves"},{"s":"ads","t":"2.8 Heaps, Graphs and Choosing a Data Structure","q":"A complete binary tree is stored in an array (indexes from 0). Where are the children of the node at index 3?","x":"","o":["Indexes 6 and 7","Indexes 7 and 8","Indexes 4 and 5","Indexes 3 and 4"],"c":[1],"m":false,"n":"2 × 3 + 1 = 7 and 2 × 3 + 2 = 8"},{"s":"ads","t":"2.8 Heaps, Graphs and Choosing a Data Structure","q":"What is printed?","x":"from collections import deque\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"E\"], \"D\": [\"B\"], \"E\": [\"C\"]}\n\ndef bfs(start):\n    visited, order = {start}, []\n    queue = deque([start])\n    while queue:\n        node = queue.popleft()\n        order.append(node)\n        for nb in graph[node]:\n            if nb not in visited:\n                visited.add(nb)\n                queue.append(nb)\n    return order\n\nprint(bfs(\"A\"))","o":["['A', 'B', 'D', 'C', 'E']","['A', 'B', 'C', 'D', 'E']","['A', 'C', 'B', 'E', 'D']","['E', 'D', 'C', 'B', 'A']"],"c":[1],"m":false,"n":""},{"s":"ads","t":"2.8 Heaps, Graphs and Choosing a Data Structure","q":"An operating system must repeatedly pick the task with the highest priority from a collection that changes constantly. Which structure is best?","x":"","o":["Heap (priority queue)","Plain array searched linearly each time","Stack","Record"],"c":[0],"m":false,"n":""},{"s":"ads","t":"2.8 Heaps, Graphs and Choosing a Data Structure","q":"A road network has 10,000 intersections and about 15,000 roads. Which representation is more suitable, and why?","x":"","o":["Adjacency matrix, because edge lookup is O(1) and the graph is dense","Adjacency list, because the graph is sparse and the list needs only O(V + E) space","Adjacency matrix, because it uses less memory for sparse graphs","Neither; graphs cannot be stored in memory"],"c":[1],"m":false,"n":""},{"s":"ads","t":"2.8 Heaps, Graphs and Choosing a Data Structure","q":"Which pairings of need and structure agree with the guide?","x":"","o":["Undo history → stack","Printer jobs served in arrival order → stack","Folder hierarchy → tree","Social-network connections → graph","Ordered data with fast search and insert → balanced binary search tree"],"c":[0,2,3,4],"m":true,"n":""},{"s":"sai","t":"3.1 Introduction, History and How Symbolic AI Works","q":"Which list names the three main parts of a symbolic AI system?","x":"","o":["Knowledge base, inference engine, interface","Training set, neural network, optimizer","Compiler, linker, debugger","Sensor, actuator, battery"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.1 Introduction, History and How Symbolic AI Works","q":"Which is the main reason funding for expert systems collapsed in the late 1980s (\"AI winter\")?","x":"","o":["They were too easy to explain","They were costly to maintain and brittle outside their narrow domain","They could not use logic","There was no programming language for them"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.1 Introduction, History and How Symbolic AI Works","q":"A system holds the rule IF fever AND cough AND difficulty breathing THEN possible pneumonia. The user reports all three symptoms, and the system adds \"possible pneumonia\". Which reasoning style is this?","x":"","o":["Backward chaining (goal-driven)","Forward chaining (data-driven)","Gradient descent","Random search"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.1 Introduction, History and How Symbolic AI Works","q":"What is the \"knowledge acquisition bottleneck\"?","x":"","o":["Computers cannot store more than 1,000 rules","Humans must write every rule by hand, which is slow and expensive","Neural networks need too much data","Rules cannot be edited after deployment"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.1 Introduction, History and How Symbolic AI Works","q":"Which are typical limitations of symbolic AI?","x":"","o":["It fails when a needed rule is missing (incomplete knowledge)","Thousands of interacting rules become slow and hard to maintain","It has difficulty with vague input such as \"kind of tired\"","Its decisions cannot be traced to any rule","It cannot learn new rules on its own"],"c":[0,1,2,4],"m":true,"n":""},{"s":"sai","t":"3.2 Propositional Logic","q":"Both p and q are false. What are the values of p → q and p ↔ q?","x":"","o":["p → q is True and p ↔ q is True","p → q is False and p ↔ q is False","p → q is True and p ↔ q is False","p → q is False and p ↔ q is True"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.2 Propositional Logic","q":"Which expression is equi  Logic","q":"Which statements are correct?","x":"","o":["Propositional logic has no quantifiers","Predicate (first-order) logic is more expressive than propositional logic","Predicate logic is simpler and easier to automate than propositional logic","First-order logic is the basis of Prolog","Propositional logic can say \"all cats are mammals\" in general form"],"c":[0,1,3],"m":true,"n":""},{"s":"sai","t":"3.4 Knowledge Representation","q":"A semantic network states: Cat is a Mammal; Mammal is an Animal; Mammal has Vertebra. What can be inferred by following the links?","x":"","o":["A cat is an animal and has a vertebra","A cat is a fish","An animal is a cat","Nothing, because links cannot be followed"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.4 Knowledge Representation","q":"\"Going to a restaurant: reservation → ordering → paying the bill\" is an example of:","x":"","o":["A script (a sequence of frames)","A propositional formula","A production rule","An ontology of diseases"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.4 Knowledge Representation","q":"Which approach is best for giving a whole organization one consistent vocabulary of \"disease\", \"symptom\" and \"treatment\"?","x":"","o":["Ontology","Propositional logic","Hill climbing","Bubble sort"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.4 Knowledge Representation","q":"Which representation has \"the meaning of links can be vague\" as its main weakness?","x":"","o":["Propositional logic","Semantic networks","Frames","Ontologies"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.4 Knowledge Representation","q":"Which are qualities of a good knowledge representation?","x":"","o":["Expressive: it captures what matters","Inferable: new facts can be derived","Efficient","Understandable to humans","Readable only by machines"],"c":[0,1,2,3],"m":true,"n":""},{"s":"sai","t":"3.5 Rule-Based Systems and Expert Systems","q":"Rule 1: IF engine won't start AND lights are dim THEN battery is weak. Rule 2: IF battery is weak THEN recommend charging or replacing it. Facts: engine won't start, lights are dim. What does forward chaining do?","x":"","o":["Rule 2 fires first, then Rule 1","Rule 1 fires and adds \"battery weak\"; then Rule 2 fires and gives the recommendation","Neither rule fires","Only Rule 1 fires and the system stops"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.5 Rule-Based Systems and Expert Systems","q":"A doctor suspects flu, then checks the patient's symptoms one by one to see whether they support that hypothesis. Which reasoning style is this?","x":"","o":["Forward chaining","Backward chaining","Random restart","Minimax"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.5 Rule-Based Systems and Expert Systems","q":"Which system worked out organic molecule structures from mass spectrometer data and is often called the first expert system?","x":"","o":["DENDRAL","XCON","ELIZA","SHRDLU"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.5 Rule-Based Systems and Expert Systems","q":"Who turns a human expert's knowledge into the knowledge base of an expert system?","x":"","o":["The end user","The knowledge engineer","The compiler","The working memory"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.5 Rule-Based Systems and Expert Systems","q":"Which are weaknesses of rule-based and expert systems?","x":"","o":["Brittle: they fail outside their narrow domain","They cannot learn on their own","Large rule sets are hard to maintain","Their decisions are not explainable","Building the knowledge base is expensive"],"c":[0,1,2,4],"m":true,"n":""},{"s":"sai","t":"3.6 Problem Formulation and Uninformed Search","q":"A tree: A has children B and C; B has children D and E; C has child F. The goal is F. Children are visited left to right. In which order does depth-first search expand nodes until it reaches F?","x":"","o":["A, B, C, D, E, F","A, B, D, E, C, F","A, C, F","F, C, A"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.6 Problem Formulation and Uninformed Search","q":"With branching factor b = 10 and a machine that checks 10⁶ nodes per second, about how long does a search to depth 8 (about 10⁸ nodes) take?","x":"","o":["About 1 second","About 100 seconds","About 2.8 hours","About 11.6 days"],"c":[1],"m":false,"n":"10⁸ ÷ 10⁶ = 100 s"},{"s":"sai","t":"3.6 Problem Formulation and Uninformed Search","q":"Which strategy keeps the frontier in a priority queue ordered by the path cost g(n) paid so far?","x":"","o":["Breadth-first search","Depth-first search","Uniform-cost search","Greedy best-first search"],"c":[2],"m":false,"n":""},{"s":"sai","t":"3.6 Problem Formulation and Uninformed Search","q":"Which uninformed strategy uses small memory, O(b·m), but is not optimal?","x":"","o":["Breadth-first search","Depth-first search","Uniform-cost search","Iterative deepening"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.6 Problem Formulation and Uninformed Search","q":"Which statements about breadth-first search are correct?","x":"","o":["It is complete when the branching factor is finite","It is optimal when all step costs are equal","Its time and space are both O(b^d)","Its memory use is small, only O(b·d)","It expands the shallowest unexpanded node first"],"c":[0,1,2,4],"m":true,"n":""},{"s":"sai","t":"3.7 Informed, Adversarial and Local Search","q":"MAX has three moves. After each, MIN picks a reply. Leaf scores: move A → 3, 12, 8; move B → 2, 4, 6; move C → 14, 5, 2. Which move does MAX choose, and what is the game value?","x":"","o":["Move A, value 3","Move B, value 2","Move C, value 14","Move A, value 12"],"c":[0],"m":false,"n":"MIN values: A = 3, B = 2, C = 2; MAX takes 3"},{"s":"sai","t":"3.7 Informed, Adversarial and Local Search","q":"For the same tree, with leaves examined left to right, how many of the 9 leaves does alpha-beta pruning evaluate?","x":"The tree from the minimax question: MAX has three moves.\nMove A → leaves 3, 12, 8\nMove B → leaves 2, 4, 6\nMove C → leaves 14, 5, 2","o":["9","7","5","3"],"c":[1],"m":false,"n":"move A: 3 leaves, α = 3; move B: leaf 2 ≤ 3, prune after 1 leaf; move C: 14, 5, 2 all needed = 3 leaves; 3 + 1 + 3 = 7"},{"s":"sai","t":"3.7 Informed, Adversarial and Local Search","q":"Edge costs: S→A = 1, S→B = 4, A→B = 2, A→G = 6, B→G = 3. Heuristic: h(S) = 5, h(A) = 4, h(B) = 3, h(G) = 0. What is the cost of the optimal path from S to G found by A*?","x":"","o":["6","7","8","10"],"c":[0],"m":false,"n":"S → A → B → G = 1 + 2 + 3"},{"s":"sai","t":"3.7 Informed, Adversarial and Local Search","q":"What does simulated annealing do at a high temperature T?","x":"","o":["It accepts many worse moves, so it explores widely and can escape local maxima","It never accepts a worse move","It behaves exactly like hill climbing","It stops immediately"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.7 Informed, Adversarial and Local Search","q":"Which statements are correct?","x":"","o":["The number of misplaced tiles (h1) is admissible","The Manhattan distance (h2) dominates h1","h2 usually expands more nodes than h1","The Manhattan distance is admissible","A consistent heuristic is also admissible"],"c":[0,1,3,4],"m":true,"n":""},{"s":"sai","t":"3.8 Planning (STRIPS) and Constraint Satisfaction","q":"Which plan reaches the goal?","x":"Blocks world actions\nPickup(x)   pre: Clear(x), OnTable(x), HandEmpty\n            delete: OnTable(x), Clear(x), HandEmpty\n            add: Holding(x)\nStack(x,y)  pre: Holding(x), Clear(y)\n            delete: Holding(x), Clear(y)\n            add: On(x,y), Clear(x), HandEmpty\n\nInitial state: OnTable(A), OnTable(B), Clear(A), Clear(B), HandEmpty\nGoal: On(A,B)","o":["Stack(A,B), then Pickup(A)","Pickup(A), then Stack(A,B)","Pickup(B), then Stack(A,B)","Stack(A,B) only"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.8 Planning (STRIPS) and Constraint Satisfaction","q":"Which fact is in the state right after Pickup(A) has been applied?","x":"Blocks world actions\nPickup(x)   pre: Clear(x), OnTable(x), HandEmpty\n            delete: OnTable(x), Clear(x), HandEmpty\n            add: Holding(x)\nStack(x,y)  pre: Holding(x), Clear(y)\n            delete: Holding(x), Clear(y)\n            add: On(x,y), Clear(x), HandEmpty\n\nInitial state: OnTable(A), OnTable(B), Clear(A), Clear(B), HandEmpty\nGoal: On(A,B)","o":["HandEmpty","Holding(A)","Clear(A)","OnTable(A)"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.8 Planning (STRIPS) and Constraint Satisfaction","q":"Which problem is described by \"moving a box also moves everything that is on it\"?","x":"","o":["The frame problem","The qualification problem","The ramification problem","The halting problem"],"c":[2],"m":false,"n":""},{"s":"sai","t":"3.8 Planning (STRIPS) and Constraint Satisfaction","q":"In a map-colouring CSP with domain {red, green, blue} for every region, regions X and Y are neighbors. X is assigned red. After forward checking, what is the domain of Y?","x":"","o":["{red, green, blue}","{green, blue}","{red}","{}"],"c":[1],"m":false,"n":""},{"s":"sai","t":"3.8 Planning (STRIPS) and Constraint Satisfaction","q":"Which are assumptions of classical planning?","x":"","o":["Actions are deterministic","The state is fully observable","The world is static (it changes only when the agent acts)","Several agents act at the same time","States and time are discrete"],"c":[0,1,2,4],"m":true,"n":""},{"s":"sai","t":"3.9 Symbolic Natural Language Processing","q":"Which stage of the pipeline builds a representation such as Chase(cat, mouse) for \"The cat chased the mouse\"?","x":"","o":["Tokenization","Part-of-speech tagging","Semantic interpretation","Morphological analysis"],"c":[2],"m":false,"n":""},{"s":"sai","t":"3.9 Symbolic Natural Language Processing","q":"Grammar: S → NP VP; NP → Det N; VP → V NP; Det → the; N → cat | mouse; V → chased. Which sentence can this grammar generate?","x":"","o":["the cat chased the mouse","chased the cat the mouse","the mouse the cat chased","cat the chased mouse"],"c":[0],"m":false,"n":""},{"s":"sai","t":"3.9 Symbolic Natural Language Processing","q":"Lexicon: good = +2, bad = −2. \"very\" multiplies the score by 1.5. \"not\" flips the sign. What is the score of \"The food was not very good\"?","x":"","o":["+3","−2","−3","+1"],"c":[2],"m":false,"n":"very good = 2 × 1.5 = +3; not flips it to −3"},{"s":"sai","t":"3.9 Symbolic Natural Language Processing","q":"Facts: parent(alice, bob). parent(alice, carol). parent(bob, dave). Rule: grandparent(X, Z) :- parent(X, Y), parent(Y, Z). What does the query grandparent(alice, W) return?","x":"","o":["W = bob","W = carol","W = dave","false"],"c":[2],"m":false,"n":""},{"s":"sai","t":"3.9 Symbolic Natural Language Processing","q":"Which are typical weaknesses of symbolic NLP?","x":"","o":["Ambiguity: many valid parses and word senses","Brittleness to slang, misspellings and new words","Heavy manual effort to write grammars, lexicons and ontologies","It needs very large training data sets","Limited coverage, because language is open-ended"],"c":[0,1,2,4],"m":true,"n":""}];

/* ---------- render loop ---------- */
function currentStation(){if(!G)return "laptop";if(G.finished)return "bench";return STEPS[Math.min(G.si,5)].station}
function liveNow(){return !!G&&!V.paused&&!V.explode&&!G.ended&&!V.finale}
let lastFrame=0;
function frame(now){
  requestAnimationFrame(frame);
  const anim=V.anim;let changed=false;
  if(anim){const k=clamp((now-anim.start)/anim.dur,0,1);anim.step.vis=lerp(anim.from,anim.to,ease(k));changed=true;if(k>=1){V.anim=null;anim.cb&&anim.cb();}}
  if(V.dkAnim){const k=clamp((now-V.dkAnim.start)/V.dkAnim.dur,0,1);V.dk=ease(k);changed=true;if(k>=1)V.dkAnim=null;}
  const active=changed||liveNow()||V.explode||V.fire||V.glitch||V.highfive||V.eyes||V.burnt;
  if(!active&&!V.dirty)return;
  if(now-lastFrame<(RM&&!changed?200:33)&&!V.dirty)return;
  lastFrame=now;V.dirty=false;drawScene(now);
}
function drawScene(t){
  const st=currentStation(), live=liveNow(), gone=!!V.explode&&(t-V.explode)>180;
  const s=G?G.steps:null;
  let body=backdrop();
  if(st==="laptop")body+=sceneLaptop(s?s[0].vis:0,t,live,gone);
  else if(st==="pc")body+=scenePC(s[1].vis,V.dk,t,live,gone);
  else if(st==="printer")body+=scenePrint(s[2].vis,V.dk,t,live,gone);
  else body+=sceneBench(t,live,gone);
  if(V.highfive)body+=highFive(t);
  if(V.explode){const ps=benchRobotPos();const c={laptop:[200,104],pc:[200,92],printer:[290,112],bench:[ps.x,ps.y-60]}[st];body+=boom(t,c[0],c[1]);}
  let shake="";
  if(V.explode&&!RM){const k=(t-V.explode)/600;if(k<1){shake=` transform="translate(${(Math.sin(t/20)*6*(1-k)).toFixed(1)},${(Math.cos(t/23)*4*(1-k)).toFixed(1)})"`;}}
  $("scene").innerHTML=`<g${shake}>${body}</g>`;
}

/* ---------- HUD ---------- */
function updateHUD(){
  let h="";
  STAGES.forEach((name,si)=>{
    const idx=STEPS.map((s,i)=>s.stage===si?i:-1).filter(i=>i>=0);
    const on=G&&!G.ended&&!G.finished&&STEPS[Math.min(G.si,5)].stage===si;
    const dots=idx.map(i=>{if(!G)return '<span class="dot"></span>';const s=G.steps[i];
      if(i<G.si||(G.finished)){const fail=s.n&&s.correct/s.n<0.5;return `<span class="dot ${fail&&["os","model","board"].includes(s.key)?(s.key==="board"?"bad":"flaw"):"ok"}"></span>`;}
      if(i===G.si&&!G.ended)return '<span class="dot act"></span>';return '<span class="dot"></span>';}).join("");
    h+=`<div class="stg${on?" on":""}"><span class="n">${si+1}</span>${name}<span class="dots">${dots}</span></div>`;
  });
  $("tracker").innerHTML=h;
  const station=$("station"),chip=$("capChip");
  $("stamp").hidden=!(G&&V.paused&&!G.ended&&!V.explode&&!V.finale);
  if(!G){station.textContent="Garage";$("capTitle").textContent="Ready to build";chip.className="chip";chip.textContent="Waiting";$("capBar").style.width="0";$("capSub").textContent="Pick a build length and start.";return;}
  if(G.finished||G.si>5){const dead=G.flags.boardFail;station.textContent="Workbench";$("capTitle").textContent=dead?"Robot destroyed":"Robot assembled";$("capBar").style.width="100%";chip.className=dead?"chip paused":"chip done";chip.textContent=dead?"Destroyed":"Done";$("capSub").textContent=`${G.correct} of ${G.N} answered right`;return;}
  const s=G.steps[G.si];
  station.textContent=s.where;
  $("capTitle").textContent=`Stage ${s.stage+1} · ${s.title}`;
  $("capBar").style.width=Math.round(clamp(s.vis,0,1)*100)+"%";
  if(V.explode){chip.className="chip paused";chip.textContent="Destroyed";}
  else if(G.phase==="stepdone"&&s.vis>=1){chip.className="chip done";chip.textContent="Done";}
  else if(V.paused){chip.className="chip paused";chip.textContent="Postponed";}
  else {chip.className="chip work";chip.textContent="Working";}
  $("capSub").textContent=G.catching?"Catching up on the postponed work...":(V.paused?"A wrong answer put this on hold. Get the next one right to restart the work.":`${s.doing} · part ${Math.min(G.qi+1,s.n)} of ${s.n}`);
}
function meterHTML(){
  const need=Math.ceil(G.N/2);
  return `<div class="meter"><div class="meterrow"><span>Right ${G.correct} · Wrong ${G.wrong}</span><span>Need ${need} of ${G.N} right or the robot explodes</span></div>
  <div class="meterbar"><i style="width:${(G.correct/G.N*100).toFixed(1)}%"></i><span class="half" title="50%"></span></div></div>`;
}

/* ---------- game flow ---------- */
function startScreen(){
  G=null;V=freshV();V.dirty=true;
  say("Yo! You ready to build a robot with me? Let's GOOO!","hyped");
  $("card").innerHTML=`<h1 class="h1">Build a robot with Turbo</h1>
  <p class="lede">You and Turbo are in the garage. Every right answer builds a little more of the robot. The questions come from your Cangcut test bank (multiple choice only).</p>
  <ol class="steps">
    <li><span class="num">1</span><div><b>Design the OS</b><span>Code the robot's operating system on the laptop. Software questions.</span></div></li>
    <li><span class="num">2</span><div><b>3D print the body</b><span>Model its looks on the PC, then print it. Algorithm and Data Structure questions.</span></div></li>
    <li><span class="num">3</span><div><b>Assemble it</b><span>Take out the print, add the wiring and the motherboard. Symbolic AI questions.</span></div></li>
  </ol>
  <div class="rules">
    <p><b>Wrong answer:</b> the work is postponed until you get one right.</p>
    <p><b>Under half right overall:</b> the robot explodes, whatever stage you are in.</p>
    <p><b>Under half right in a part:</b> 3D modeling gives a deformed body, the OS gives the robot a seizure fit, and the motherboard catches fire.</p>
  </div>
  <div><div class="label" id="lenLabel">Build length</div>
  <div class="seg" role="group" aria-labelledby="lenLabel">${LENS.map(([k,n,d])=>`<button id="len-${k}" aria-pressed="${k===lenChoice}" data-len="${k}">${n}<small>${d}</small></button>`).join("")}</div></div>
  <div class="row"><button class="btn" id="startBtn">Start building</button></div>`;
  document.querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{lenChoice=b.dataset.len;document.querySelectorAll("[data-len]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.len===lenChoice))});
  $("startBtn").onclick=()=>newGame(lenChoice);
  updateHUD();
}
function newGame(len){
  const plan=PLAN[len];
  const pools={};["sw","ads","sai"].forEach(k=>pools[k]=shuffle(DATA.map((q,i)=>q.s===k?i:-1).filter(i=>i>=0)));
  G={len,si:0,qi:0,correct:0,wrong:0,answered:0,streak:0,missed:[],phase:"answer",ended:false,finished:false,catching:false,flags:{osFail:false,deformed:false,boardFail:false},
     steps:STEPS.map((s,i)=>({...s,n:plan[i],qs:pools[s.pool].splice(0,plan[i]),correct:0,wrong:0,vis:0}))};
  G.N=plan.reduce((a,b)=>a+b,0);
  V=freshV();V.dirty=true;
  say(...LINES.intro.os);
  showQuestion();
}
function qNumber(){let n=0;for(let i=0;i<G.si;i++)n+=G.steps[i].n;return n+G.qi+1}
function showQuestion(){
  const s=G.steps[G.si],q=DATA[s.qs[G.qi]];
  G.phase="answer";G.sel=new Set();
  const ctx=q.x?`<pre class="ctx${/^(def |while|from )|^\s/.test(q.x)||q.x.includes("\n    ")||q.x.includes("  /")?"":" plain"}">${esc(q.x)}</pre>`:"";
  $("card").innerHTML=`${meterHTML()}
  <div class="qhead"><span class="pill acc">Q ${qNumber()} of ${G.N}</span><span class="pill">${esc(SECTION[q.s])} · ${esc(q.t)}</span><span class="pill">${q.m?"Pick all that apply":"Pick one"}</span></div>
  <h2 class="qtext">${esc(q.q)}</h2>${ctx}
  <div class="opts" role="group" aria-label="Answer options">${q.o.map((o,i)=>`<button class="opt" id="opt-${i}" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>
  ${q.m?`<div class="row"><button class="btn" id="lockBtn" disabled>Lock in answer</button><p class="hint">Choose every correct option, then lock it in.</p></div>`:""}
  <div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  if(q.m)$("lockBtn").onclick=()=>submit([...G.sel]);
  updateHUD();V.dirty=true;
}
function choose(i){
  if(!G||G.phase!=="answer")return;
  const q=DATA[G.steps[G.si].qs[G.qi]];
  if(q.m){G.sel.has(i)?G.sel.delete(i):G.sel.add(i);$("opt-"+i).classList.toggle("sel",G.sel.has(i));$("lockBtn").disabled=G.sel.size===0;}
  else submit([i]);
}
function submit(sel){
  if(G.phase!=="answer")return;
  const s=G.steps[G.si],q=DATA[s.qs[G.qi]];
  const right=sel.length===q.c.length&&sel.every(i=>q.c.includes(i));
  G.phase="feedback";G.answered++;
  q.o.forEach((_,i)=>{const b=$("opt-"+i);b.disabled=true;b.classList.remove("sel");if(q.c.includes(i))b.classList.add("right");else if(sel.includes(i))b.classList.add("wrong");});
  if($("lockBtn"))$("lockBtn").hidden=true;
  const ansTxt=q.c.map(i=>"ABCDE"[i]+". "+q.o[i]).join(" · ");
  let nextDelay;
  if(right){
    G.correct++;s.correct++;G.streak++;V.paused=false;
    const dur=clamp(2200-s.n*120,1100,2000);
    V.anim={step:s,from:s.vis,to:s.correct/s.n,start:performance.now(),dur,cb:()=>{const b=$("nextBtn");if(b)b.disabled=false;updateHUD();}};
    if(G.streak===3)say(...LINES.streak[0]);else if(G.streak>=2&&Math.random()<0.3)say(...pick(LINES.envy));else say(...pick(LINES.correct));
    nextDelay=dur;
  } else {
    G.wrong++;s.wrong++;G.streak=0;V.paused=true;G.missed.push({q,sel});
    say(...pick(LINES.wrong));nextDelay=500;
  }
  const remaining=G.N-G.answered;
  const doomed=(G.correct+remaining)<G.N/2;
  $("fb").innerHTML=`<div class="fb ${right?"ok":"no"}"><h3>${right?"Correct! The build moves forward.":"Not quite. The build is postponed."}</h3>
    ${right?"":`<p>Correct answer: <b>${esc(ansTxt)}</b></p>`}${q.n?`<p>${esc(q.n)}</p>`:""}</div>
    ${doomed?`<p class="hint" style="color:var(--bad);font-weight:700">Half right is out of reach now...</p>`:`<div class="row" style="margin-top:12px"><button class="btn" id="nextBtn" ${right?"disabled":""}>${G.qi+1>=s.n?"Finish this part":"Next question"}</button></div>`}`;
  updateHUD();
  if(doomed){setTimeout(explode,1600);return;}
  const nb=$("nextBtn");nb.onclick=next;
  if(!right)setTimeout(()=>{if($("nextBtn"))$("nextBtn").disabled=false},nextDelay);
}
function next(){
  const s=G.steps[G.si];G.qi++;
  if(G.qi<s.n){showQuestion();return;}
  finishStep();
}
function finishStep(){
  const s=G.steps[G.si];G.phase="stepdone";
  $("card").innerHTML=`${meterHTML()}<h2 class="qtext">Wrapping up: ${esc(s.title.toLowerCase())}...</h2>`;
  const after=()=>{G.catching=false;
    const fail=s.correct/s.n<0.5;
    if(s.key==="os")G.flags.osFail=fail;
    if(s.key==="model"&&fail){G.flags.deformed=true;V.dkAnim={start:performance.now(),dur:1400};}
    if(s.key==="board")G.flags.boardFail=fail;
    const line=(fail&&LINES.doneFail[s.key])||LINES.donePass[s.key];say(...line);
    let note="";
    if(fail&&s.key==="model")note="You got under half of the 3D modeling questions right, so the model came out deformed.";
    else if(fail&&s.key==="os")note="You got under half of the OS questions right. Something in that code might be off...";
    else if(fail&&s.key==="board")note="You got under half of the motherboard questions right. Fingers crossed...";
    $("card").innerHTML=`${meterHTML()}<div class="label">Stage ${s.stage+1} · ${esc(s.where)}</div><h2 class="h1">${esc(s.done)}</h2>
      <p class="lede">${s.correct} of ${s.n} right on the first try${s.wrong?`, ${s.wrong} postponed ${s.wrong===1?"piece":"pieces"} caught up`:""}.</p>
      ${note?`<div class="rules"><p>${esc(note)}</p></div>`:""}
      <div class="row"><button class="btn" id="goBtn">${esc(s.next)}</button></div>`;
    $("goBtn").onclick=advance;updateHUD();V.dirty=true;};
  if(s.vis<0.999){G.catching=true;V.paused=false;V.anim={step:s,from:s.vis,to:1,start:performance.now(),dur:1500,cb:after};updateHUD();}
  else after();
}
function advance(){
  G.si++;G.qi=0;
  if(G.si>=STEPS.length){finale();return;}
  say(...LINES.intro[STEPS[G.si].key]);showQuestion();
}
function finale(){
  G.finished=true;V.finale=true;G.phase="finale";V.dirty=true;
  $("card").innerHTML=`${meterHTML()}<h2 class="h1">Powering on...</h2><p class="lede">Turbo flips the switch.</p>`;
  updateHUD();
  if(G.flags.boardFail){
    V.fire=0.01;const st=performance.now();
    const grow=()=>{const k=clamp((performance.now()-st)/700,0,1);V.fire=Math.max(0.01,ease(k));if(k<1)requestAnimationFrame(grow)};grow();
    say("AAAAAHHH! The motherboard's on FIRE!","scared");
    setTimeout(()=>{V.burnt=true;V.fire=0.35;say("...He's gone. The fire took the whole robot.","sad");},2800);
    setTimeout(()=>{V.fire=0;endGame("fire")},4200);
    return;
  }
  V.eyes=true;
  if(G.flags.osFail){V.glitch=true;say("Uh... is he okay?! Why is he shaking like that?!","worried");setTimeout(doHighFive,2800);}
  else if(G.flags.deformed){say("He's alive! A little lopsided, but he's OUR lopsided robot!","awkward, happy");setTimeout(doHighFive,2200);}
  else {say("HE'S ALIVE! Look at his eyes!","excited");setTimeout(doHighFive,1600);}
}
function doHighFive(){
  V.highfive=performance.now();
  const flawed=G.flags.osFail||G.flags.deformed;
  say(flawed?"Up top anyway! We still built a robot together!":"UP TOP! We built a robot! You're a legend, congrats!",flawed?"excited, laughing":"overjoyed");
  setTimeout(()=>endGame(G.flags.osFail&&G.flags.deformed?"both":G.flags.osFail?"glitch":G.flags.deformed?"deformed":"perfect"),1500);
}
function explode(){
  G.ended=true;V.explode=performance.now();V.paused=false;V.dirty=true;
  say("AAAAAAHHHHH!","scared");updateHUD();
  setTimeout(()=>{say("The whole robot just blew up... We needed at least half right.","sad");endGame("explode")},2600);
}
function endGame(kind){
  G.ended=true;G.phase="end";updateHUD();
  const T={explode:["The robot exploded","You could no longer reach half the questions right, so the build blew up."],
    fire:["The motherboard caught fire","Under half right on the motherboard questions set the board on fire and destroyed the robot."],
    perfect:["Robot complete!","A clean OS, a solid body and a working motherboard. High five!"],
    deformed:["Robot complete, but deformed","The 3D modeling went wrong, so the body came out crooked."],
    glitch:["Robot complete, but it has a seizure fit","The OS code had problems, so the finished robot shakes uncontrollably."],
    both:["Robot complete, deformed and glitching","Both the 3D model and the OS had problems."]}[kind];
  const pct=G.answered?Math.round(G.correct/G.answered*100):0;
  const rows=G.steps.map((s,i)=>{
    const ans=s.correct+s.wrong;
    if(!ans)return `<tr><td>${esc(s.title)}</td><td>-</td><td><span class="tag na">Not reached</span></td></tr>`;
    const done=i<G.si||G.finished;
    const fail=done&&s.correct/s.n<0.5;
    let tag=done?'<span class="tag ok">Done</span>':'<span class="tag bad">Blew up here</span>';
    if(fail&&s.key==="model")tag='<span class="tag flaw">Deformed</span>';
    if(fail&&s.key==="os")tag='<span class="tag flaw">Glitchy OS</span>';
    if(fail&&s.key==="board")tag='<span class="tag bad">Fire</span>';
    return `<tr><td>${esc(s.title)}</td><td>${s.correct}/${ans}</td><td>${tag}</td></tr>`;}).join("");
  const miss=G.missed.map(m=>`<div class="miss"><span>${esc(m.q.q)}</span><span class="a">${esc(m.q.c.map(i=>"ABCDE"[i]+". "+m.q.o[i]).join(" · "))}</span></div>`).join("");
  $("card").innerHTML=`<div class="label">Result</div><h2 class="h1">${esc(T[0])}</h2><p class="lede">${esc(T[1])}</p>
  <div class="row" style="gap:18px;align-items:flex-end"><div><div class="big">${pct}%</div><div class="hint">${G.correct} of ${G.answered} answered right${G.answered<G.N?` (${G.N} planned)`:""}</div></div></div>
  <table class="report"><tbody>${rows}</tbody></table>
  ${G.missed.length?`<details><summary>Review the ${G.missed.length} question${G.missed.length>1?"s":""} you missed</summary>${miss}</details>`:""}
  <div class="row"><button class="btn" id="againBtn">Build another robot</button><button class="btn ghost" id="menuBtn">Change length</button></div>`;
  $("againBtn").onclick=()=>newGame(G.len);$("menuBtn").onclick=startScreen;
}
document.addEventListener("keydown",e=>{
  if(!G||G.phase!=="answer"||e.metaKey||e.ctrlKey||e.altKey)return;
  const i="abcde".indexOf(e.key.toLowerCase());
  const q=DATA[G.steps[G.si].qs[G.qi]];
  if(i>=0&&i<q.o.length){e.preventDefault();choose(i);}
  else if(e.key==="Enter"&&q.m&&G.sel.size){e.preventDefault();submit([...G.sel]);}
});
startScreen();
requestAnimationFrame(frame);
</script>

</body></html>
